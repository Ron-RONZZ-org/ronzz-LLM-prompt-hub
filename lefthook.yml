# Rebuild the generated prompts before every commit and stage dist/ with it,
# so a source edit can never be committed with a stale dist/.
#
# The hook is run by the machine's global git hook dispatcher (~/.git-hooks,
# from the ronzz-dotfiles repo), which calls `lefthook run --no-auto-install`.
# Do not run `lefthook install` here: it refuses custom hooks paths and would
# try to overwrite the global dispatcher.
pre-commit:
  commands:
    build-prompts:
      run: |
        python3 build-prompts.py --prune
        git add -A dist
