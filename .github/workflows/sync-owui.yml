name: Sync prompts to Open WebUI

# The repo's source of truth is forgejo.ronzz.org; this GitHub repository is a
# push mirror. Pushing to main here (i.e. after the mirror syncs) reconciles
# Open WebUI with dist/: system prompts -> custom Models, everything else ->
# slash-command Prompts.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-owui
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warn if dist/ was committed stale
        # Non-fatal: the next step rebuilds dist/ anyway. This annotation just
        # flags that the *committed* dist/ (which dist/opencode/ consumers
        # symlink) drifted from src/.
        run: |
          python3 build-prompts.py --check || \
            echo "::warning title=dist/ is stale::dist/ did not match src/ in this commit — run 'python3 build-prompts.py' and commit. The workflow rebuilds it before syncing, so Open WebUI is still updated."

      - name: Rebuild dist/ (in case it was not built before committing)
        run: python3 build-prompts.py

      - name: Sync to Open WebUI
        env:
          OWUI_URL: https://llm.ronzz.org
          OWUI_API_KEY: ${{ secrets.OWUI_API_KEY }}
        run: python3 sync-owui.py --no-build
